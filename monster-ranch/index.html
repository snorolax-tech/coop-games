<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Ranch</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='55' r='40' fill='%23ffb347'/><circle cx='36' cy='48' r='10' fill='white'/><circle cx='64' cy='48' r='10' fill='white'/><circle cx='38' cy='50' r='5'/><circle cx='66' cy='50' r='5'/></svg>" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#3d8ee8,#bfe6ff);font-family:'Trebuchet MS',sans-serif;color:#2b2d42;z-index:99">
      <div style="font-size:64px;font-weight:900;color:#ef476f;text-shadow:3px 3px 0 #2b2d42">Monster Ranch</div>
      <div style="font-size:20px;font-weight:800;margin-top:12px">🌱 Building your ranch…</div>
      <div style="width:240px;height:10px;border:3px solid #2b2d42;border-radius:8px;margin-top:14px;overflow:hidden;background:#fff7e6"><div style="height:100%;width:40%;background:#06d6a0;animation:load 1s ease-in-out infinite alternate"></div></div>
      <style>@keyframes load{from{margin-left:0}to{margin-left:60%}}</style>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
